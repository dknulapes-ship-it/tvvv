name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          echo "Archivos en el repo:"
          find . -not -path './.git/*' -type f | head -40
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)
          if [ -z "$F" ]; then echo "NO HAY settings.gradle.kts EN EL REPO"; exit 1; fi
          cd "$(dirname "$F")"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TVInstaller
          path: '**/build/outputs/apk/debug/app-debug.apk'
